name: Refresh Forever content

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scrape Blizzard news and Forever page
        id: scrape
        run: node scripts/update-content.mjs
      - name: Commit manifest if it changed
        run: |
          git add public/data/manifest.json content/official
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git config user.name "geekos-bot"
          git config user.email "geekos-bot@users.noreply.github.com"
          git commit -m "content: refresh Forever news and dates ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
